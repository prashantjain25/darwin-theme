name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  theme-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n install.sh dock.sh restore.sh install-lxqt.sh dock-lxqt.sh restore-lxqt.sh
